<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Dentiste - Dentilib</title>
    <link rel="stylesheet" href="../../styles/variables.css" />
    <link rel="stylesheet" href="../../styles/base.css" />
    <link rel="stylesheet" href="../../styles/dashboard.css" />
    <style>html { visibility: hidden; }</style>
</head>
<body>
    <header> <!-- Entête -->
        <div class="inline-fields">
            <div class="inline">
                <h2 id="TitleNameUser"></h2>
                <div class="disconnect-div">
                    <button id="disconnect">Se déconnecter</button>
                </div>
            </div>
        </div>
        <button id="exportData" type="button">Exporter mes données</button>
        <button id="deleteAccount" type="button">Supprimer mon compte</button>
    </header>

    <main> <!-- Partie Principale -->
        <section> <!-- Section pour la création -->
            <button id="createWorksheet">Nouvelle Fiche</button>
        </section>

        <section> <!-- Section pour l'afficahge des fiches -->
            <div class="filters">
                <input type="text" id="filter-patient-name" placeholder="Filtrer par nom patient">
                <select id="filter-status">
                    <option value="ALL" selected>Tous</option>
                </select>
            </div>

            <table> 
                <thead>
                    <tr>
                        <th>Numéro</th>
                        <th>Patient</th>
                        <th>Email</th>
                        <th>Numéro sécurité</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="worksheetTableBody"></tbody> <!-- Où seront affichés les fiches -->
            </table>
        </section>
    </main>

    <footer>
        <p>Consulting School Project © 2025 Dentilib <a href="/html/mentions_legales.html">Mentions légales et confidentialité</a></p>
    </footer>

    <script type="module" src="/js/dentiste/dashboard.js"></script>
</body>
</html>

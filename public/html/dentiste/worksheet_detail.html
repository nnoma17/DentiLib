<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <title>Créer une fiche - Dentilib</title>
        <link rel="stylesheet" href="../../styles/variables.css" />
        <link rel="stylesheet" href="../../styles/base.css" />
        <link rel="stylesheet" href="../../styles/dashboard.css" />
        <style>html { visibility: hidden; }</style>
    </head>
    <body>
        <header>
            <div class="inline-fields">
                <div class="inline">
                    <h2 id="TitleNameUser"></h2>
                    <div class="disconnect-div">
                    <button id="homePage" type="button">Page d'accueil</button>
                    </div>
                </div>
            </div>
        </header>

    <h1>Créer une fiche patient</h1>

    <form id="worksheetCreateForm" novalidate>
        <section name="error">
            <div role="alert" aria-live="polite">
                <p id="errorForm" class="error">Message erreur ici</p>
            </div>
        </section>
        <section name = "patientInfo">
            <label for="firstNamePatient">Prénom</label>
            <input type="text" id="firstNamePatient" required>

            <label for="lastNamePatient">Nom</label>
            <input type="text" id="lastNamePatient" required>

            <label for="emailNamePatient">Email</label>
            <input type="email" id="emailNamePatient" required>

            <label for="numSecuPatient">Numéro sécurité sociale</label>
            <input type="text" id="numSecuPatient" inputmode="numeric" pattern="[0-9]{1,15}" required>
        </section>
        <section name = "procedure">
            <label>Actes</label>
            <table>
                <thead>
                    <tr>
                        <th><!-- Case à cocher --></th> 
                        <th>Nom</th>
                        <th>Description</th>
                        <th>Prix</th>
                    </tr>
                </thead>
                <tbody id="worksheetTableBody">
                </tbody>
            </table>
        </section>
        <section name = "comment">
            <label for="commentProcedure">Remarque</label>
            <input type="text" id="commentProcedure" maxlength="2000">
        </section>
        <section nam = "validation">
            <button id="validationWorksheet" type="button">Valider et Envoyer</button>
            <button type="button"  id="modifyWorksheet">Modifier</button>
        </section>
    </form>
    <footer>
        <p>Consulting School Project © 2025 Dentilib <a href="/html/mentions_legales.html">Mentions légales et confidentialité</a></p>
    </footer>

    <script type="module" src="/js/dentiste/worksheet.js"></script>
    <script type="module" src="/js/dentiste/worksheet_details.js"></script>
    </body>
</html>

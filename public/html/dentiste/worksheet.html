<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <title>Créer une fiche - Dentilib</title>
        <link rel="stylesheet" href="../../styles/variables.css" />
        <link rel="stylesheet" href="../../styles/base.css" />
        <link rel="stylesheet" href="../../styles/dashboard.css" />
    </head>
    <body>
        <header>
            <div class="inline-fields">
                <div class="inline">
                    <h2 id="TitleNameUser"></h2>
                    <div class="disconnect-div">
                    <button id="homePage"  type="button">Page d'acceuil</button>
                    </div>
                </div>
            </div>
        </header>

    <h1>Créer une fiche patient</h1>

    <form id="worksheetCreateForm" novalidate>
        <section name="error">
            <div role="alert" aria-live="polite">
                <p id="errorForm" class="error">Message erreur ici</p>
            </div>
        </section>
        <section name = "patientInfo">
            <label for="firstNamePatient">Prénom</label>
            <input type="text" id="firstNamePatient" autocomplete="given-name" required>

            <label for="lastNamePatient">Nom</label>
            <input type="text" id="lastNamePatient" autocomplete="family-name" required>

            <label for="emailNamePatient">Email</label>
            <input type="email" id="emailNamePatient" autocomplete="email" required>

            <label for="numSecuPatient">Numéro sécurité sociale</label>
            <input type="text" id="numSecuPatient" inputmode="numeric" pattern="[0-9]{1,15}" required>
        </section>
        <section name = "procedure">
            <label>Actes</label>
            <table>
                <thead>
                    <tr>
                        <th><!-- Case à cocher --></th> 
                        <th>Nom</th>
                        <th>Description</th>
                        <th>Prix</th>
                    </tr>
                </thead>
                <tbody id="worksheetTableBody">
                </tbody>
            </table>
        </section>
        <section name = "comment">
            <label for="commentProcedure">Remarque</label>
            <input type="text" id="commentProcedure" maxlength="2000">
        </section>

        <button id="createWorksheet" type="submit">Créer la fiche</button>
        <button id="validationCreateWorksheet" type="button">Valider et Envoyer</button>
    </form>


        <footer>
            <p>Consulting School Project © 2025 Dentilib</p>
        </footer>

    <script type="module" src="/js/dentiste/worksheet.js"></script>
    </body>
</html>

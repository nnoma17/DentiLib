<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Connexion a l'application de gestion des fiches de travaux DentiLib." />
    <title>Login - Dentilib</title>
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/login.css" />
    <link rel="stylesheet" href="/styles/variables.css" />
</head>
<body>
    <header>
        <h1>Dentilib</h1>
    </header>
 
    <main>
        <section>
            <h2>Bienvenue !</h2>
            <form id="loginForm" novalidate>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Email" autocomplete="username" required />

                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" placeholder="Mot de passe" autocomplete="current-password" required />

                <button type="submit">Se connecter</button>
            </form>
            <p>Pas encore inscrit ? Contactez l'administrateur.</p>
            <div role="alert" aria-live="polite">
                <p id="errorLogin" class="error">Message erreur ici</p>
            </div>
        </section>
    </main>
 
    <footer>
        <p>Consulting School Project © 2025 Dentilib</p>
    </footer>
 
    <script src="../js/login.js"></script>
</body>
</html>
